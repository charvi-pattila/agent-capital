<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Agent Capital</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0d0d11; color: #e6e6ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    -webkit-app-region: drag; user-select: none;
  }
  .box { text-align: center; padding: 24px; max-width: 420px; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 16px;
    border: 3px solid #2a2a35; border-top-color: #7c5cfc; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; color: #8a8a99; margin-top: 6px; word-break: break-all; }
  .err .spinner { display: none; }
  .err .title { color: #ff6b6b; }
  pre { text-align: left; font-size: 11px; color: #b0b0bd; background: #16161d; border: 1px solid #2a2a35;
        border-radius: 8px; padding: 10px; white-space: pre-wrap; user-select: text; -webkit-app-region: no-drag; }
  button { -webkit-app-region: no-drag; margin-top: 12px; background: #7c5cfc; color: #fff; border: 0;
           border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
  <div class="box" id="box">
    <div class="spinner"></div>
    <div class="title" id="title">Starting Agent Capital…</div>
    <div class="sub" id="sub"></div>
  </div>
</body>
</html>
